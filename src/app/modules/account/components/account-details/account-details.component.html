<div class="row center">
  Details here....
</div>
<div class="center">

  <div *ngIf="contact">
    <div class="d-flex align-items-center">
      <label class="fw-bolder col-7 ">FirstName</label>
      <div class="value">{{contact.firstName}}</div>
    </div>
    <div class="d-flex align-items-center">
      <label class=" fw-bolder col-7">LastName</label>
      <div class="value">{{contact.lastName}}</div>
    </div>
    <div class="d-flex align-items-center">
      <label class="fw-bolder col-7">Email</label>
      <div class="value">{{contact.email}}</div>
    </div>
    <div class="d-flex align-items-center">
      <label class="fw-bolder col-7">Phone</label>
      <div class="value">{{contact.phone}}</div>
    </div>
    <div class="d-flex align-items-center">
      <label class="fw-bolder col-7">JobTitle</label>
      <div class="value">{{contact.jobTitle}}</div>
    </div>
  </div>
</div>
